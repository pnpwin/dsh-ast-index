name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Install upstream CLI separately
        run: cargo install ast-index --version 3.56.0 --locked
      - name: Verify upstream CLI version
        run: ast-index --version
      - name: Run Bun suite with real CLI
        run: bun run test
      - name: Check Node compatibility
        run: bun run test:node
      - name: Validate distributable
        run: bun run pack:check
      - name: Build bundle archive
        run: bun run pack
